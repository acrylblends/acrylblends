name: CI

# The framework's home (spec 049 slice 17). Two jobs:
#  - `check`: the whole gate (`pnpm run check`: lint, build, typecheck, every test, the scaffolder, the guide, the panel, the tarball) on Linux, Node 22, 24 and 26.
#  - `packages`: the framework packages' own suites (the router, node server, state, inspect, db and kv providers, the door, the framework build) on Linux, macOS and Windows,
#    Node 22, 24 and 26 (26 is what a fresh Homebrew install gives). The SQLite provider and the JSON-file store follow the operating system's file locking and rename rules, so one runner proves neither.
on:
  push:
    branches: [main, '[0-9][0-9][0-9]-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: check (Linux, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # Bun is experimental and has one smoke gate (verify:framework runs the Bun adapter on it); the check fails when it is missing here.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  packages:
    name: packages (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # Bun is experimental and has one smoke gate (verify:framework runs the Bun adapter on it); the check fails when it is missing here.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run verify:framework
      - run: pnpm run typecheck
      - run: pnpm run test:packages
      # The real terminal (node-pty) on every OS, Windows included: a load failure fails here with its reason, it is not skipped.
      - run: pnpm run test:driver-pty
      # `npm create acrylblends my-app agent` from the packed tarballs on every OS: 1.0.4 and 1.0.5 failed on every Windows machine and nothing ran the command there.
      - run: pnpm run verify:create

  # The desktop door in a real Electron (windows and menu as door verbs, a window attached to a dev server, the guards on Quit and the last window). Its own job, not in `check`:
  # it downloads Electron and opens windows. Linux runs it under a virtual display; a failure here fails the build, it is not skipped.
  desktop:
    name: desktop (${{ matrix.os }}, Node 24)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Virtual display (Linux)
        if: runner.os == 'Linux'
        run: command -v xvfb-run >/dev/null || (sudo apt-get update && sudo apt-get install -y xvfb)
      - name: verify:desktop (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm run verify:desktop
      - name: verify:desktop
        if: runner.os != 'Linux'
        run: pnpm run verify:desktop

