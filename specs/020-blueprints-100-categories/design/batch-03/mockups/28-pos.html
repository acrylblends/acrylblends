<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Counter — Point of Sale</title><style>
:root{--bg:#f1f3f4;--paper:#fff;--ink:#20292d;--muted:#8c999d;--line:#e2e7e9;--dark:#263238;--yellow:#f4d35e;--green:#38856a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:13px/1.4 Inter,system-ui,sans-serif;color:var(--ink)}button{font:inherit;cursor:pointer}.app{height:100vh;min-height:650px;display:grid;grid-template-rows:57px 1fr}.top{background:var(--dark);color:#fff;display:flex;align-items:center;padding:0 20px;gap:18px}.logo{font-size:14px;font-weight:850;letter-spacing:.7px}.logo span{color:var(--yellow)}.terminal{color:#a8b5b8;font-size:10px}.top .spacer{flex:1}.cashier{display:flex;align-items:center;gap:8px;font-size:10px;color:#d5dedf}.cashier i{font-style:normal;width:27px;height:27px;background:#415158;border-radius:50%;display:grid;place-items:center}.top button{border:1px solid #536168;background:#35444a;color:#fff;border-radius:5px;padding:7px 10px;font-size:10px}.main{display:grid;grid-template-columns:minmax(0,1fr) 375px;min-height:0}.catalog{padding:18px 22px;overflow:auto}.cataloghead{display:flex;justify-content:space-between;align-items:end}.cataloghead h1{font-size:21px;margin:0;letter-spacing:-.6px}.cataloghead p{font-size:10px;color:var(--muted);margin:5px 0 0}.search{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:6px;width:230px;font-size:11px}.categories{display:flex;gap:7px;margin:17px 0}.cat{border:1px solid var(--line);background:#fff;border-radius:5px;padding:7px 11px;font-size:10px;color:#657479}.cat.active{background:var(--dark);color:#fff;border-color:var(--dark)}.products{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:11px}.product{border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px;text-align:left;position:relative;min-height:145px;display:flex;flex-direction:column}.product:hover{border-color:#aebdc0;box-shadow:0 4px 16px #1c343b0c}.product .thumb{height:70px;border-radius:5px;background:#f5f2ea;display:grid;place-items:center;font-size:29px;margin-bottom:9px}.product:nth-child(3n) .thumb{background:#f0f3ed}.product:nth-child(4n) .thumb{background:#f3eef0}.product b{font-size:11px}.product small{font-size:9px;color:#8f9b9e;margin-top:3px}.product strong{margin-top:auto;padding-top:8px;font-size:12px}.stock{position:absolute;top:15px;right:14px;font-size:8px;color:#718078}.order{background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.orderhead{padding:18px 18px 12px;border-bottom:1px solid var(--line)}.orderhead h2{margin:0;font-size:16px}.orderhead p{font-size:9px;color:var(--muted);margin:4px 0 0}.orderitems{padding:10px 18px;overflow:auto;flex:1}.empty{color:#9ba5a7;text-align:center;padding:45px 10px;font-size:11px}.lineitem{display:grid;grid-template-columns:1fr auto;gap:6px;padding:12px 0;border-bottom:1px solid #eef1f2}.lineitem b{font-size:11px}.lineitem small{display:block;color:#8e9a9d;font-size:9px;margin-top:3px}.lineitem .price{font-weight:750;font-size:11px}.qty{display:flex;gap:7px;align-items:center;margin-top:6px}.qty button{border:1px solid var(--line);background:#f8f9f9;border-radius:4px;width:22px;height:22px}.summary{border-top:1px solid var(--line);padding:14px 18px}.sumrow{display:flex;justify-content:space-between;color:#7e8b8e;font-size:10px;margin:7px 0}.sumrow.total{font-size:16px;color:var(--ink);font-weight:800;margin-top:13px}.pay{width:100%;border:0;background:var(--yellow);padding:14px;border-radius:6px;font-weight:850;margin-top:10px}.pay:disabled{opacity:.5;cursor:not-allowed}.keyrow{display:flex;justify-content:space-between;color:#96a1a4;font-size:9px;margin-top:10px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 15px;background:var(--dark);color:white;border-radius:6px;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:900px){.main{grid-template-columns:1fr 320px}.products{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.app{height:auto;min-height:100vh}.main{display:flex;flex-direction:column}.order{min-height:430px;border-left:0;border-top:1px solid var(--line)}.catalog{padding:15px 10px}.products{grid-template-columns:repeat(2,1fr)}.cataloghead{align-items:flex-start;gap:9px;flex-direction:column}.search{width:100%}.top{padding:0 10px}.terminal{display:none}}
</style></head><body><div class="app"><header class="top"><div class="logo">COUNTER<span>.</span></div><span class="terminal">STORE 004　/　REGISTER 02</span><div class="spacer"></div><div class="cashier"><i>AM</i> Alex · Cashier</div><button id="hold">Hold sale</button></header><main class="main"><section class="catalog"><div class="cataloghead"><div><h1>New sale</h1><p>Choose products to add them to the current basket.</p></div><input class="search" id="search" placeholder="Search products or scan barcode…"></div><div class="categories"><button class="cat active" data-cat="All">All items</button><button class="cat" data-cat="Coffee">Coffee</button><button class="cat" data-cat="Bakery">Bakery</button><button class="cat" data-cat="Pantry">Pantry</button><button class="cat" data-cat="Cold drinks">Cold drinks</button></div><div class="products" id="products"></div></section><aside class="order"><div class="orderhead"><h2>Current sale <span style="float:right;color:#95a2a5;font-size:10px">#S-0104</span></h2><p>04 November 2026 · Walk-in customer</p></div><div class="orderitems" id="items"><div class="empty">Basket is empty<br>Tap a product to begin a sale.</div></div><div class="summary"><div class="sumrow"><span>Subtotal</span><b id="subtotal">€0.00</b></div><div class="sumrow"><span>VAT (10%)</span><b id="vat">€0.00</b></div><div class="sumrow total"><span>Total due</span><b id="total">€0.00</b></div><button class="pay" id="pay" disabled>Charge €0.00 →</button><div class="keyrow"><span>F2 · Search　 F4 · Hold</span><span>TEST REGISTER</span></div></div></aside></main></div><div class="toast" id="toast"></div><script>
const products=[['Flat white','Coffee','☕',3.8,22],['Cappuccino','Coffee','🥛',3.6,18],['Espresso','Coffee','◉',2.4,40],['Iced latte','Cold drinks','🧋',4.2,9],['Butter croissant','Bakery','🥐',2.9,14],['Sourdough loaf','Bakery','🍞',5.5,8],['Cinnamon roll','Bakery','🥮',3.4,11],['Oat cookies','Pantry','🍪',4.1,16],['House granola','Pantry','🥣',7.9,7],['Orange juice','Cold drinks','🍊',3.2,12],['Sparkling water','Cold drinks','◌',2.0,30],['Filter coffee','Coffee','🫖',2.8,24]];let basket={},cat='All';const $=s=>document.querySelector(s);function renderProducts(){let q=$('#search').value.toLowerCase();$('#products').innerHTML='';products.forEach((p,i)=>{if((cat==='All'||p[1]===cat)&&p[0].toLowerCase().includes(q)){let b=document.createElement('button');b.className='product';b.innerHTML=`<span class="stock">${p[4]} left</span><span class="thumb">${p[2]}</span><b>${p[0]}</b><small>${p[1]}</small><strong>€${p[3].toFixed(2)}</strong>`;b.onclick=()=>add(i);$('#products').append(b)}})}function add(i){basket[i]=(basket[i]||0)+1;renderBasket()}function renderBasket(){let el=$('#items');el.innerHTML='';let entries=Object.entries(basket);if(!entries.length)el.innerHTML='<div class="empty">Basket is empty<br>Tap a product to begin a sale.</div>';let subtotal=0;entries.forEach(([i,q])=>{let p=products[i];subtotal+=p[3]*q;let d=document.createElement('div');d.className='lineitem';d.innerHTML=`<div><b>${p[0]}</b><small>${p[1]} · €${p[3].toFixed(2)} each</small><div class="qty"><button data-i="${i}" data-d="-1">−</button><span>${q}</span><button data-i="${i}" data-d="1">＋</button><button data-i="${i}" data-d="0" style="margin-left:4px;width:auto;padding:0 6px">Remove</button></div></div><span class="price">€${(p[3]*q).toFixed(2)}</span>`;el.append(d)});let vat=subtotal*.1,total=subtotal+vat;$('#subtotal').textContent='€'+subtotal.toFixed(2);$('#vat').textContent='€'+vat.toFixed(2);$('#total').textContent='€'+total.toFixed(2);$('#pay').textContent='Charge €'+total.toFixed(2)+' →';$('#pay').disabled=!entries.length}$('#items').onclick=e=>{let b=e.target.closest('button[data-i]');if(!b)return;let i=+b.dataset.i,d=+b.dataset.d;if(d===0||basket[i]+d<=0)delete basket[i];else basket[i]+=d;renderBasket()};document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x===b));renderProducts()});$('#search').oninput=renderProducts;function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1600)}$('#pay').onclick=()=>{let total=$('#total').textContent; if(confirm('Take test payment of '+total+'?')){basket={};renderBasket();toast('Test sale completed · receipt ready')}};$('#hold').onclick=()=>{toast('Sale held locally');basket={};renderBasket()};renderProducts();renderBasket();
</script></body></html>
