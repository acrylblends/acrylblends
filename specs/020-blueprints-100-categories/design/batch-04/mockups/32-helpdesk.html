<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relay — Helpdesk</title><style>
:root{--nav:#20252d;--nav2:#2b323d;--bg:#f4f6f8;--line:#e6e9ed;--ink:#242a33;--muted:#89919b;--blue:#3974bd;--pale:#eaf2fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 Inter,system-ui,sans-serif}.app{height:100vh;min-height:620px;display:grid;grid-template-columns:64px 280px minmax(400px,1fr) 255px}.rail{background:var(--nav);color:#aab2bd;display:flex;flex-direction:column;align-items:center;padding:15px 0;gap:15px}.logo{width:34px;height:34px;border-radius:10px;background:#4b83ca;color:white;display:grid;place-items:center;font-weight:900;font-size:18px;margin-bottom:18px}.rail button{width:38px;height:38px;border:0;border-radius:9px;background:none;color:#9ba4b0;font-size:17px}.rail button.active{background:#364657;color:#fff}.inbox{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.inboxhead{padding:22px 17px 13px}.inboxhead h1{font-size:17px;margin:0 0 12px}.search{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;font:11px system-ui,sans-serif;background:#fafbfc}.filters{display:flex;gap:5px;padding:0 14px 12px;border-bottom:1px solid var(--line)}.filters button{border:0;background:transparent;color:#8a939d;padding:7px 8px;font-size:9px;border-radius:5px}.filters button.active{background:var(--pale);color:var(--blue);font-weight:800}.tickets{overflow:auto}.ticket{padding:14px 16px;border-bottom:1px solid #f0f2f4;cursor:pointer;border-left:3px solid transparent}.ticket.active{background:#f4f8fd;border-left-color:var(--blue)}.tickettop{display:flex;justify-content:space-between;gap:8px}.tickettop b{font-size:11px}.ticket small{color:var(--muted);font-size:9px}.ticket p{font-size:10px;color:#717b86;margin:7px 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{font-size:8px;padding:3px 6px;border-radius:4px;background:#f1f3f5;color:#77818d}.tag.high{background:#fff0ec;color:#bd634d}.tag.wait{background:#fff6df;color:#a67b22}.thread{display:flex;flex-direction:column;min-width:0;background:#fbfcfd}.threadhead{padding:17px 22px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.threadhead h2{font-size:15px;margin:0}.threadhead p{font-size:9px;color:var(--muted);margin:4px 0 0}.threadtools{display:flex;gap:7px}.btn{border:1px solid var(--line);background:#fff;border-radius:5px;padding:8px 10px;font-size:9px;color:#5d6671;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.messages{padding:24px 5%;overflow:auto;flex:1}.dayline{text-align:center;color:#a0a7af;font-size:9px;margin:4px 0 22px}.msg{display:flex;gap:10px;margin-bottom:19px;max-width:680px}.avatar{width:30px;height:30px;border-radius:50%;background:#dce8f5;color:#416e9e;font-size:10px;font-weight:800;display:grid;place-items:center;flex:none}.msg.agent .avatar{background:#e7e4fa;color:#7562a8}.msgbody{min-width:0}.msgmeta{font-size:9px;color:#8c959e;margin-bottom:6px}.bubble{background:white;border:1px solid var(--line);padding:12px 14px;border-radius:0 9px 9px 9px;font-size:11px;line-height:1.65;max-width:590px}.msg.agent .bubble{background:#edf4fc;border-color:#dce9f7}.reply{background:#fff;border-top:1px solid var(--line);padding:14px 22px}.reply textarea{width:100%;height:74px;border:1px solid var(--line);border-radius:7px;padding:11px;font:11px system-ui,sans-serif;resize:vertical}.replybar{display:flex;justify-content:space-between;align-items:center;margin-top:8px;color:#9ba2aa;font-size:9px}.properties{background:#fff;border-left:1px solid var(--line);padding:20px 16px;overflow:auto}.properties h3{font-size:11px;letter-spacing:.3px;margin:0 0 15px}.person{display:flex;gap:10px;align-items:center;padding-bottom:17px;border-bottom:1px solid var(--line)}.person .avatar{width:36px;height:36px}.person b{font-size:11px;display:block}.person small{font-size:9px;color:var(--muted)}.prop{padding:14px 0;border-bottom:1px solid #f0f2f4}.prop label{display:block;font-size:8px;color:#99a1aa;letter-spacing:.8px;margin-bottom:6px}.prop select,.prop input{width:100%;border:1px solid var(--line);padding:8px;border-radius:5px;font:10px system-ui,sans-serif;background:#fff}.history{font-size:9px;color:#78838f;line-height:1.9}.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#20252d;color:white;padding:9px 14px;border-radius:6px;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:1050px){.app{grid-template-columns:54px 250px minmax(350px,1fr)}.properties{display:none}}@media(max-width:720px){.app{grid-template-columns:48px 1fr;height:auto;min-height:100vh}.inbox{height:42vh;border-right:0}.thread{grid-column:2;min-height:58vh}.rail{grid-row:1/3}.ticket{padding:9px 12px}.messages{padding:15px}.threadhead{padding:12px}}
</style></head><body><div class="app"><aside class="rail"><div class="logo">r</div><button class="active">▤</button><button>◉</button><button>♧</button><button>▦</button><button>⚙</button></aside><section class="inbox"><div class="inboxhead"><h1>Support inbox <span style="color:#9ca5ae;font-size:10px;font-weight:400">· 28</span></h1><input class="search" id="search" placeholder="⌕  Search tickets or customers"></div><div class="filters"><button class="active" data-filter="All">All 28</button><button data-filter="Open">Open 12</button><button data-filter="Pending">Pending 8</button><button data-filter="Closed">Closed</button></div><div class="tickets" id="tickets"></div></section><main class="thread"><header class="threadhead"><div><h2 id="subject">Order status — #WB-2391</h2><p id="ticketMeta">Ticket #4821 · Opened today at 09:14</p></div><div class="threadtools"><button class="btn" id="snooze">Snooze</button><button class="btn primary" id="resolve">Resolve ticket</button></div></header><div class="messages" id="messages"></div><div class="reply"><textarea id="replyText" placeholder="Reply to this customer…"></textarea><div class="replybar"><span>↗ Send with email · Attach file</span><button class="btn primary" id="send">Send reply ↗</button></div></div></main><aside class="properties"><h3>Customer & ticket</h3><div class="person"><div class="avatar" id="personAvatar">ML</div><div><b id="personName">Maya Lewis</b><small id="personEmail">maya@example.test</small></div></div><div class="prop"><label>STATUS</label><select id="status"><option>Open</option><option>Pending</option><option>Closed</option></select></div><div class="prop"><label>PRIORITY</label><select id="priority"><option>Normal</option><option>High</option><option>Low</option></select></div><div class="prop"><label>ASSIGNEE</label><select id="assignee"><option>Alex Morgan</option><option>Sam Rivera</option><option>Unassigned</option></select></div><div class="prop"><label>TYPE</label><select><option>Order question</option><option>Technical issue</option><option>Billing</option></select></div><div class="prop"><label>ORDER</label><div style="font-size:11px;font-weight:700">#WB-2391</div><small style="color:#89919b">€ 128.00 · Shipped</small></div><div class="prop"><label>RECENT ACTIVITY</label><div class="history">09:14 · Ticket created<br>09:22 · Assigned to Alex<br>09:36 · Customer replied<br>10:02 · Viewed by you</div></div></aside></div><div class="toast" id="toast"></div><script>
const $=s=>document.querySelector(s);let data=[{id:4821,name:'Maya Lewis',initial:'ML',email:'maya@example.test',subject:'Order status — #WB-2391',preview:'Could you let me know when the parcel will arrive?',status:'Open',priority:'High',assignee:'Alex Morgan',time:'4m',messages:[['customer','Maya Lewis','09:14','Hi team, I placed order WB-2391 last week. The tracking page has not changed since Monday. Could you let me know when the parcel will arrive?'],['agent','Alex Morgan','09:26','Hello Maya, thanks for reaching out. I’m checking the carrier scan now and will update you shortly.'],['customer','Maya Lewis','09:36','Thank you. I need it before Friday if possible.']]},{id:4818,name:'Jonas Weber',initial:'JW',email:'jonas@example.test',subject:'Invoice address correction',preview:'The company name on my invoice is missing.',status:'Pending',priority:'Normal',time:'18m',messages:[['customer','Jonas Weber','08:45','The company name on my invoice is missing. Can you reissue it with the correct billing details?']]},{id:4812,name:'Priya Shah',initial:'PS',email:'priya@example.test',subject:'Unable to sign in',preview:'I receive an error after entering my code.',status:'Open',priority:'High',time:'1h',messages:[['customer','Priya Shah','08:03','I receive an error after entering my one-time code. Can you help?']]},{id:4804,name:'Luca Meyer',initial:'LM',email:'luca@example.test',subject:'Return request',preview:'I would like to return the jacket in size M.',status:'Pending',priority:'Normal',time:'2h',messages:[['customer','Luca Meyer','Yesterday','I would like to return the jacket in size M.']]},{id:4799,name:'Emma Novak',initial:'EN',email:'emma@example.test',subject:'Product question',preview:'Does the lamp support dimmable bulbs?',status:'Closed',priority:'Low',time:'1d',messages:[['customer','Emma Novak','Yesterday','Does the lamp support dimmable bulbs?']]}];let current=0,filter='All';function drawList(){let term=$('#search').value.toLowerCase();$('#tickets').innerHTML='';data.filter(t=>(filter==='All'||t.status===filter)&&(`${t.name} ${t.subject} ${t.preview}`).toLowerCase().includes(term)).forEach(t=>{let d=document.createElement('div');d.className='ticket'+(data.indexOf(t)===current?' active':'');d.innerHTML=`<div class="tickettop"><b>${t.name}</b><small>${t.time}</small></div><div style="font-size:10px;font-weight:650;margin-top:5px">${t.subject}</div><p>${t.preview}</p><span class="tag ${t.priority==='High'?'high':t.status==='Pending'?'wait':''}">${t.priority==='High'?'HIGH':t.status}</span>`;d.onclick=()=>{current=data.indexOf(t);drawList();drawThread()};$('#tickets').append(d)})}function drawThread(){let t=data[current];$('#subject').textContent=t.subject;$('#ticketMeta').textContent=`Ticket #${t.id} · ${t.status} · Updated ${t.time} ago`;$('#personName').textContent=t.name;$('#personEmail').textContent=t.email;$('#personAvatar').textContent=t.initial;$('#status').value=t.status;$('#priority').value=t.priority;$('#assignee').value=t.assignee||'Unassigned';$('#messages').innerHTML='<div class="dayline">TODAY · THURSDAY, 5 NOVEMBER</div>';t.messages.forEach(m=>{let d=document.createElement('div');d.className='msg '+(m[0]==='agent'?'agent':'');d.innerHTML=`<div class="avatar">${m[1].split(' ').map(x=>x[0]).join('')}</div><div class="msgbody"><div class="msgmeta"><b>${m[1]}</b> · ${m[2]}</div><div class="bubble">${m[3]}</div></div>`;$('#messages').append(d)})}function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1500)}$('.filters').onclick=e=>{if(e.target.dataset.filter){filter=e.target.dataset.filter;document.querySelectorAll('.filters button').forEach(b=>b.classList.toggle('active',b===e.target));drawList()}};$('#search').oninput=drawList;$('#status').onchange=e=>{data[current].status=e.target.value;drawList();drawThread();toast('Ticket status updated')};$('#priority').onchange=e=>{data[current].priority=e.target.value;drawList();toast('Priority updated')};$('#assignee').onchange=e=>{data[current].assignee=e.target.value;toast('Ticket assignment updated')};$('#send').onclick=()=>{let v=$('#replyText').value.trim();if(!v)return;data[current].messages.push(['agent','Alex Morgan','Just now',v]);$('#replyText').value='';drawThread();toast('Reply added to thread')};$('#resolve').onclick=()=>{$('#status').value='Closed';data[current].status='Closed';drawList();drawThread();toast('Ticket resolved')};$('#snooze').onclick=()=>{data[current].status='Pending';$('#status').value='Pending';drawList();drawThread();toast('Ticket snoozed until tomorrow')};drawList();drawThread();
</script></body></html>
