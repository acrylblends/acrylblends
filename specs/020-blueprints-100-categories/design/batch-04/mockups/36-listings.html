<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Habitat — Listings</title><style>
:root{--ink:#222c31;--muted:#8e999b;--line:#e4e9e7;--bg:#f7f8f6;--green:#416d5b;--sage:#e9efeb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 Inter,system-ui,sans-serif}.top{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#fff;border-bottom:1px solid var(--line)}.brand{font:700 22px Georgia,serif;letter-spacing:-.8px}.brand span{color:var(--green)}.topnav{display:flex;gap:22px;color:#8b9697;font-size:10px}.topnav b{color:var(--ink)}.topbtn{background:var(--green);color:white;border:0;padding:9px 13px;border-radius:4px;font-size:9px}.layout{display:grid;grid-template-columns:255px 1fr;min-height:calc(100vh - 66px)}.filters{background:#fff;border-right:1px solid var(--line);padding:22px 19px}.filters h3{font:600 16px Georgia,serif;margin:0 0 17px}.filtergroup{padding:14px 0;border-top:1px solid #eef1ef}.filtergroup label{display:block;color:#8b9899;font-size:8px;letter-spacing:.8px;margin-bottom:8px}.filters input,.filters select{width:100%;padding:9px;border:1px solid var(--line);border-radius:4px;font:10px system-ui,sans-serif;background:#fff}.chips{display:flex;flex-wrap:wrap;gap:5px}.chips button{background:#f6f8f6;border:1px solid #e8ede9;padding:6px 8px;border-radius:4px;font-size:8px;color:#66736d}.chips button.active{background:#e4ede6;border-color:#c8d8cd;color:#3d684e}.result{padding:22px 25px;min-width:0}.resulthead{display:flex;justify-content:space-between;align-items:end;margin-bottom:17px}.resulthead h1{font:600 25px Georgia,serif;margin:0}.resulthead p{font-size:9px;color:var(--muted);margin:5px 0 0}.sort{border:1px solid var(--line);background:#fff;border-radius:4px;padding:8px 9px;font-size:9px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;transition:.15s}.card:hover{transform:translateY(-3px);box-shadow:0 10px 22px #20382f10}.photo{height:160px;position:relative;overflow:hidden;background:linear-gradient(145deg,#c4d0c6,#8b9e91)}.photo:before{content:"";position:absolute;width:70%;height:70%;bottom:0;left:15%;background:#e9e6dd;clip-path:polygon(0 25%,50% 0,100% 25%,100% 100%,0 100%);box-shadow:inset 0 0 0 1px #aaa}.photo:after{content:"";position:absolute;width:25%;height:44%;bottom:0;left:37.5%;background:#a5b6aa;box-shadow:30px 0 0 -7px #a5b6aa,-30px 0 0 -7px #a5b6aa}.photo.p2{background:linear-gradient(145deg,#c9c1ad,#83948d)}.photo.p2:before{background:#f0e6d8;clip-path:polygon(0 12%,50% 0,100% 12%,100% 100%,0 100%)}.photo.p3{background:linear-gradient(145deg,#b4c5be,#748f89)}.photo.p4{background:linear-gradient(145deg,#d4c5b7,#998e80)}.photo.p5{background:linear-gradient(145deg,#b5beb5,#687c70)}.photo.p6{background:linear-gradient(145deg,#c3cccf,#81999c)}.ribbon{position:absolute;left:10px;top:10px;background:#fff;border-radius:3px;padding:5px 7px;font-size:8px;color:#60756a}.heart{position:absolute;right:10px;top:9px;width:26px;height:26px;border:0;border-radius:50%;background:#ffffffdd;color:#75817c}.cardbody{padding:12px}.price{font:700 18px Georgia,serif}.address{font-size:10px;color:#75827e;margin:4px 0 10px}.facts{display:flex;gap:12px;color:#84908c;font-size:8px;border-top:1px solid #f0f2f0;padding-top:9px}.facts b{color:#53675b}.drawer{position:fixed;right:0;top:0;width:min(420px,100%);height:100vh;background:white;box-shadow:-12px 0 40px #152b251b;padding:22px;z-index:5;transform:translateX(105%);transition:.25s;overflow:auto}.drawer.open{transform:none}.drawer button.close{float:right;border:0;background:#edf1ee;border-radius:50%;width:28px;height:28px}.drawer .photo{height:210px;margin:25px 0 15px;border-radius:7px}.drawer h2{font:600 25px Georgia,serif;margin:5px 0}.drawer p{font-size:10px;color:#7e8983;line-height:1.7}.drawer .btn{background:var(--green);color:white;border:0;border-radius:4px;padding:11px 15px;font-size:9px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#263c33;color:white;padding:10px 15px;border-radius:6px;opacity:0;transition:.2s}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.top{padding:0 13px}.topnav{display:none}.layout{grid-template-columns:1fr}.filters{border-right:0;border-bottom:1px solid var(--line);padding:13px}.filtergroup{display:none}.filtergroup:first-of-type{display:block;border:0;padding:0}.filters h3{display:none}.result{padding:14px 10px}.grid{grid-template-columns:1fr 1fr;gap:8px}.photo{height:115px}.cardbody{padding:9px}.price{font-size:15px}.facts{gap:5px}.resulthead h1{font-size:21px}}
</style></head><body><header class="top"><div class="brand">habitat<span>.</span></div><nav class="topnav"><b>Buy</b><span>Rent</span><span>New developments</span><span>Agents</span></nav><button class="topbtn" id="saved">♡ Saved homes</button></header><div class="layout"><aside class="filters"><h3>Find a place</h3><div class="filtergroup"><label>LOCATION</label><input id="location" value="Vienna, Austria" placeholder="City or postcode"></div><div class="filtergroup"><label>PROPERTY TYPE</label><div class="chips" id="types"><button class="active" data-type="All">All</button><button data-type="Apartment">Apartment</button><button data-type="House">House</button><button data-type="Loft">Loft</button></div></div><div class="filtergroup"><label>PRICE RANGE</label><select id="price"><option value="all">Any price</option><option value="400000">Under €400,000</option><option value="600000">Under €600,000</option><option value="800000">Under €800,000</option></select></div><div class="filtergroup"><label>BEDROOMS</label><div class="chips" id="beds"><button class="active" data-beds="0">Any</button><button data-beds="1">1+</button><button data-beds="2">2+</button><button data-beds="3">3+</button></div></div><div style="margin-top:17px;font-size:9px;color:#97a09a">Filters update the local demo inventory only.</div></aside><main class="result"><div class="resulthead"><div><h1>Homes in Vienna</h1><p><span id="count">6</span> handpicked properties · Updated this week</p></div><select class="sort" id="sort"><option>Newest first</option><option>Price: low to high</option><option>Price: high to low</option></select></div><div class="grid" id="grid"></div></main></div><aside class="drawer" id="drawer"><button class="close" id="close">×</button><div class="photo p1" id="hero"></div><div style="color:#6d8978;font-size:9px;letter-spacing:1px">PROPERTY DETAILS</div><h2 id="dPrice">€ 525,000</h2><div id="dAddress" style="font-size:11px;color:#798680">Neubau · Vienna</div><p id="dDesc">A light-filled apartment with generous living spaces and a calm courtyard outlook.</p><div style="padding:13px;background:#f3f6f3;border-radius:6px;font-size:10px;line-height:2" id="dFacts"></div><button class="btn" style="margin-top:16px;width:100%" id="enquire">Request a viewing</button></aside><div class="toast" id="toast"></div><script>
const $=s=>document.querySelector(s);let homes=[{id:1,type:'Apartment',price:525000,area:'Neubau',street:'Lindengasse 18',beds:2,baths:1,size:84,tag:'NEW',desc:'A light-filled apartment with generous living spaces and a calm courtyard outlook.',photo:'p1'},{id:2,type:'House',price:790000,area:'Döbling',street:'Krottenbachstraße 42',beds:4,baths:2,size:168,tag:'OPEN HOUSE',desc:'A family home with a small garden, generous storage and a sunny terrace.',photo:'p2'},{id:3,type:'Loft',price:465000,area:'Margareten',street:'Schönbrunner Straße 77',beds:1,baths:1,size:71,tag:'DESIGN PICK',desc:'An adaptable loft with tall ceilings and an industrial character.',photo:'p3'},{id:4,type:'Apartment',price:349000,area:'Leopoldstadt',street:'Taborstraße 29',beds:2,baths:1,size:68,tag:'PRICE REDUCED',desc:'A practical city apartment close to parks and public transport.',photo:'p4'},{id:5,type:'House',price:635000,area:'Hietzing',street:'Fasangartengasse 9',beds:3,baths:2,size:142,tag:'GARDEN',desc:'A quiet detached home with a leafy garden and separate study.',photo:'p5'},{id:6,type:'Apartment',price:585000,area:'Alsergrund',street:'Währinger Straße 103',beds:3,baths:2,size:96,tag:'NEW',desc:'A renovated period apartment with original details and high ceilings.',photo:'p6'}];let type='All',beds=0,saved=new Set(),selected=null;function draw(){let cap=$('#price').value,loc=$('#location').value.trim().toLowerCase();let list=homes.filter(h=>(type==='All'||h.type===type)&&(!cap||cap==='all'||h.price<=+cap)&&h.beds>=beds&&(!loc||loc==='vienna'||(h.area+' '+h.street+' vienna').toLowerCase().includes(loc)));let sort=$('#sort').value;if(sort==='Price: low to high')list.sort((a,b)=>a.price-b.price);else if(sort==='Price: high to low')list.sort((a,b)=>b.price-a.price);else list.sort((a,b)=>b.id-a.id);$('#count').textContent=list.length;$('#grid').innerHTML='';list.forEach(h=>{let d=document.createElement('div');d.className='card';d.innerHTML=`<div class="photo ${h.photo}"><span class="ribbon">${h.tag}</span><button class="heart" data-heart="${h.id}">${saved.has(h.id)?'♥':'♡'}</button></div><div class="cardbody"><div class="price">€ ${h.price.toLocaleString('de-AT')}</div><div class="address">${h.street}, ${h.area}</div><div class="facts"><span><b>${h.beds}</b> beds</span><span><b>${h.baths}</b> baths</span><span><b>${h.size}</b> m²</span></div></div>`;d.querySelector('.photo').onclick=e=>{if(e.target.dataset.heart)return;open(h)};d.querySelector('.heart').onclick=e=>{e.stopPropagation();let id=+e.target.dataset.heart;saved.has(id)?saved.delete(id):saved.add(id);e.target.textContent=saved.has(id)?'♥':'♡'};$('#grid').append(d)})}function open(h){selected=h;$('#hero').className='photo '+h.photo;$('#dPrice').textContent='€ '+h.price.toLocaleString('de-AT');$('#dAddress').textContent=h.street+' · '+h.area+', Vienna';$('#dDesc').textContent=h.desc;$('#dFacts').innerHTML=`${h.beds} bedrooms<br>${h.baths} bathrooms<br>${h.size} m² living area<br>${h.type}`;$('#drawer').classList.add('open')}function toast(s){$('#toast').textContent=s;$('#toast').style.opacity=1;setTimeout(()=>$('#toast').style.opacity=0,1400)}$('#types').onclick=e=>{if(e.target.dataset.type){type=e.target.dataset.type;document.querySelectorAll('#types button').forEach(b=>b.classList.toggle('active',b===e.target));draw()}};$('#beds').onclick=e=>{if(e.target.dataset.beds!==undefined){beds=+e.target.dataset.beds;document.querySelectorAll('#beds button').forEach(b=>b.classList.toggle('active',b===e.target));draw()}};$('#price').onchange=draw;$('#location').oninput=draw;$('#sort').onchange=draw;$('#close').onclick=()=>$('#drawer').classList.remove('open');$('#enquire').onclick=()=>{toast('Viewing request saved for '+selected.street);$('#drawer').classList.remove('open')};$('#saved').onclick=()=>{let list=homes.filter(h=>saved.has(h.id));toast(list.length?`${list.length} saved home(s) in this demo`:'No saved homes yet')};draw();
</script></body></html>
